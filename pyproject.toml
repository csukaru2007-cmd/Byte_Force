[project]
name = "shipsafe"
version = "2.0.0"
description = "ShipSafe: explainable, hardware-aware security analysis for ESP32 PlatformIO projects"
readme = "README.md"
authors = [
    { name = "csukaru2007-cmd", email = "csukaru2007@gmail.com" }
]
requires-python = ">=3.12"
# Keep in sync with requirements.txt
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.34",
    "requests==2.34.2",
    "rapidfuzz==3.14.6",
    "libclang==18.1.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]
