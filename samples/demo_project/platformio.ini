; ShipSafe DEMO PROJECT - deliberately contains issues for demonstration.
; All credentials are fake; network endpoints are documentation/example addresses.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library @ 2.3.0
    adafruit/Adafruit Unified Sensor @ 1.1.14
    knolleary/PubSubClient @ 2.8
    jasonlzt/FastLED
    bblanch0n/ArduinoJson @ 7.4.3
build_flags =
    -D STATUS_LED_PIN=34
    -D MQTT_PORT=1883
