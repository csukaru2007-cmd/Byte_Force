[common]
lib_deps =
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = ${common.lib_deps}

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = ${common.lib_deps}
